<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | Instant Money Solutions</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1683e8;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
            font-size: 14px;
        }

        .success {
            color: #16a34a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1683e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Staff Login</h1>

    <div class="subtitle">
        Instant Money Solutions
    </div>

    <form id="loginForm">

        <label>Employee ID</label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            required
            autocomplete="username"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
            autocomplete="current-password"
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← Back to Website
    </a>

</div>


<script>

/*************************************************
 * STAFF LOGIN
 *************************************************/

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const employeeId =
            document
                .getElementById("employeeId")
                .value
                .trim()
                .toUpperCase();

        const password =
            document
                .getElementById("password")
                .value;

        const message =
            document.getElementById("message");

        const loginBtn =
            document.getElementById("loginBtn");


        message.className = "message";
        message.innerText = "";


        /*************************************************
         * BASIC VALIDATION
         *************************************************/

        if (!employeeId) {

            message.innerText =
                "Please enter Employee ID.";

            return;
        }


        if (!password) {

            message.innerText =
                "Please enter Password.";

            return;
        }


        loginBtn.disabled = true;
        loginBtn.innerText = "Checking...";


        try {

            /*************************************************
             * GET EMPLOYEE EMAIL
             *************************************************/

            const {
                data: employeeEmail,
                error: employeeError
            } = await supabaseClient
                .rpc(
                    "get_employee_login_email",
                    {
                        p_employee_id: employeeId
                    }
                );


            if (employeeError) {

                console.error(employeeError);

                message.innerText =
                    "Employee verification failed.";

                loginBtn.disabled = false;
                loginBtn.innerText = "Login";

                return;
            }


            if (!employeeEmail) {

                message.innerText =
                    "Employee ID is not authorised.";

                loginBtn.disabled = false;
                loginBtn.innerText = "Login";

                return;
            }


            /*************************************************
             * SUPABASE EMAIL + PASSWORD LOGIN
             *************************************************/

            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({

                email: employeeEmail,

                password: password

            });


            if (error) {

                console.error(error);

                message.innerText =
                    "Invalid Employee ID or Password.";

                loginBtn.disabled = false;
                loginBtn.innerText = "Login";

                return;
            }


            /*************************************************
             * GET EMPLOYEE DETAILS
             *************************************************/

            const {
                data: employee,
                error: detailsError
            } = await supabaseClient
                .from("employees")
                .select(
                    "employee_id, name, role, active"
                )
                .eq(
                    "employee_id",
                    employeeId
                )
                .eq(
                    "active",
                    true
                )
                .maybeSingle();


            if (detailsError || !employee) {

                console.error(detailsError);

                await supabaseClient.auth.signOut();

                message.innerText =
                    "Employee account is not authorised.";

                loginBtn.disabled = false;
                loginBtn.innerText = "Login";

                return;
            }


            /*************************************************
             * SAVE EMPLOYEE SESSION DETAILS
             *************************************************/

            sessionStorage.setItem(
                "employee_id",
                employee.employee_id
            );

            sessionStorage.setItem(
                "employee_name",
                employee.name
            );

            sessionStorage.setItem(
                "employee_role",
                employee.role
            );


            /*************************************************
             * LOGIN SUCCESS
             *************************************************/

            message.className =
                "message success";

            message.innerText =
                "Login successful. Opening tracker...";


            setTimeout(function() {

window.location.href =
    "add-lead.html";

            }, 500);

        }

        catch (error) {

            console.error(error);

            message.innerText =
                "Something went wrong. Please try again.";

            loginBtn.disabled = false;
            loginBtn.innerText = "Login";

        }

    });

</script>

</body>
</html>
