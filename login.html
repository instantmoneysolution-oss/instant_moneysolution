<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | Instant Money Solutions</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1683e8;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
            font-size: 14px;
        }

        .success {
            color: #16a34a;
        }

        .hidden {
            display: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1683e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Staff Login</h1>

    <div class="subtitle">
        Instant Money Solutions
    </div>

    <!-- STEP 1 -->
    <form id="loginForm">

        <label>Employee ID</label>

        <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            required
            autocomplete="off"
        >

        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter 10 digit mobile number"
            maxlength="10"
            inputmode="numeric"
            required
            autocomplete="off"
        >

        <button type="submit" id="sendOtpBtn">
            Send OTP
        </button>

    </form>


    <!-- STEP 2 -->
    <form id="otpForm" class="hidden">

        <label>Enter OTP</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6 digit OTP"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
        >

        <button type="submit" id="verifyOtpBtn">
            Verify OTP
        </button>

    </form>


    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← Back to Website
    </a>

</div>


<script>

let currentPhone = "";
let currentEmployeeId = "";


/*************************************************
 * CLEAN MOBILE NUMBER
 *************************************************/

function cleanMobile(value) {

    return value
        .replace(/\D/g, "")
        .slice(0, 10);

}


/*************************************************
 * SEND OTP
 *************************************************/

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const employeeId =
            document
                .getElementById("employeeId")
                .value
                .trim()
                .toUpperCase();

        const mobile =
            cleanMobile(
                document.getElementById("mobile").value
            );

        const message =
            document.getElementById("message");

        const sendOtpBtn =
            document.getElementById("sendOtpBtn");


        message.className = "message";
        message.innerText = "";


        /*************************************************
         * BASIC VALIDATION
         *************************************************/

        if (!employeeId) {

            message.innerText =
                "Please enter Employee ID.";

            return;
        }


        if (!/^\d{10}$/.test(mobile)) {

            message.innerText =
                "Please enter a valid 10 digit mobile number.";

            return;
        }


        sendOtpBtn.disabled = true;
        sendOtpBtn.innerText = "Checking...";


        /*************************************************
         * SAVE CURRENT LOGIN DETAILS
         *************************************************/

        currentEmployeeId = employeeId;
        currentPhone = "+91" + mobile;


        /*************************************************
         * SEND OTP
         *************************************************/

        const { error } =
            await supabaseClient.auth.signInWithOtp({

                phone: currentPhone

            });


        if (error) {

            console.error(error);

            message.innerText =
                error.message;

            sendOtpBtn.disabled = false;
            sendOtpBtn.innerText = "Send OTP";

            return;
        }


        /*************************************************
         * SHOW OTP BOX
         *************************************************/

        document
            .getElementById("loginForm")
            .classList.add("hidden");

        document
            .getElementById("otpForm")
            .classList.remove("hidden");


        message.className =
            "message success";

        message.innerText =
            "OTP sent to your mobile number.";


        document
            .getElementById("otp")
            .focus();

    });


/*************************************************
 * VERIFY OTP
 *************************************************/

document
    .getElementById("otpForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const otp =
            document
                .getElementById("otp")
                .value
                .trim();

        const message =
            document.getElementById("message");

        const verifyOtpBtn =
            document.getElementById("verifyOtpBtn");


        message.className = "message";
        message.innerText = "";


        if (!/^\d{6}$/.test(otp)) {

            message.innerText =
                "Please enter the 6 digit OTP.";

            return;
        }


        verifyOtpBtn.disabled = true;
        verifyOtpBtn.innerText = "Verifying...";


        /*************************************************
         * VERIFY SUPABASE OTP
         *************************************************/

        const { data, error } =
            await supabaseClient.auth.verifyOtp({

                phone: currentPhone,

                token: otp,

                type: "sms"

            });


        if (error) {

            console.error(error);

            message.innerText =
                error.message;

            verifyOtpBtn.disabled = false;
            verifyOtpBtn.innerText = "Verify OTP";

            return;
        }


        /*************************************************
         * CHECK EMPLOYEE
         *************************************************/

        const {
            data: employee,
            error: employeeError
        } = await supabaseClient
            .from("employees")
            .select("employee_id, name, mobile, role, active")
            .eq("employee_id", currentEmployeeId)
            .eq("mobile", currentPhone.replace("+91", ""))
            .eq("active", true)
            .maybeSingle();


        if (employeeError) {

            console.error(employeeError);

            message.innerText =
                "Employee verification failed.";

            await supabaseClient.auth.signOut();

            verifyOtpBtn.disabled = false;
            verifyOtpBtn.innerText = "Verify OTP";

            return;
        }


        if (!employee) {

            message.innerText =
                "Employee ID or mobile number is not authorised.";

            await supabaseClient.auth.signOut();

            verifyOtpBtn.disabled = false;
            verifyOtpBtn.innerText = "Verify OTP";

            return;
        }


        /*************************************************
         * LOGIN SUCCESS
         *************************************************/

        sessionStorage.setItem(
            "employee_id",
            employee.employee_id
        );

        sessionStorage.setItem(
            "employee_name",
            employee.name
        );

        sessionStorage.setItem(
            "employee_role",
            employee.role
        );


        message.className =
            "message success";

        message.innerText =
            "Login successful. Opening tracker...";


        setTimeout(function() {

            window.location.href =
                "tracker.html";

        }, 500);

    });

</script>

</body>
</html>
